<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#134e4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="800" rx="32" fill="url(#bg)"/>

  <!-- Outer cycle ring with arrows -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 26" opacity="0.9"/>

  <!-- Arrowheads on the ring (clockwise) -->
  <g fill="#0d9488">
    <path transform="translate(400,100) rotate(90)" d="M0,-12 L14,10 L0,4 L-14,10 Z"/>
    <path transform="translate(612,188) rotate(0)" d="M0,-12 L14,10 L0,4 L-14,10 Z"/>
    <path transform="translate(700,400) rotate(270)" d="M0,-12 L14,10 L0,4 L-14,10 Z"/>
    <path transform="translate(612,612) rotate(180)" d="M0,-12 L14,10 L0,4 L-14,10 Z"/>
  </g>

  <!-- ==================== NODE 1: AMMONIA (top) ==================== -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="155" r="105" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="400" y="125" font-size="20" font-weight="800" fill="#134e4a" letter-spacing="1">AMMONIA</text>
    <text x="400" y="158" font-size="30" font-weight="700" fill="#0d9488">NH₃</text>
    <text x="400" y="193" font-size="14" font-weight="500" fill="#5b7f7a">Fish waste +</text>
    <text x="400" y="213" font-size="14" font-weight="500" fill="#5b7f7a">uneaten food</text>
  </g>

  <!-- ==================== NODE 2: NITRITE (right) ==================== -->
  <g filter="url(#shadow)">
    <circle cx="645" cy="400" r="105" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="645" y="370" font-size="20" font-weight="800" fill="#134e4a" letter-spacing="1">NITRITE</text>
    <text x="645" y="403" font-size="30" font-weight="700" fill="#0d9488">NO₂⁻</text>
    <text x="645" y="438" font-size="14" font-weight="500" fill="#5b7f7a">Nitrosomonas</text>
    <text x="645" y="458" font-size="14" font-weight="500" fill="#5b7f7a">bacteria</text>
  </g>

  <!-- ==================== NODE 3: NITRATE (bottom) ==================== -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="645" r="105" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="400" y="615" font-size="20" font-weight="800" fill="#134e4a" letter-spacing="1">NITRATE</text>
    <text x="400" y="648" font-size="30" font-weight="700" fill="#0d9488">NO₃⁻</text>
    <text x="400" y="683" font-size="14" font-weight="500" fill="#5b7f7a">Nitrobacter /</text>
    <text x="400" y="703" font-size="14" font-weight="500" fill="#5b7f7a">Nitrospira</text>
  </g>

  <!-- ==================== NODE 4: WATER CHANGES (left) ==================== -->
  <g filter="url(#shadow)">
    <circle cx="155" cy="400" r="105" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="370" font-size="20" font-weight="800" fill="#134e4a" letter-spacing="1">REMOVED</text>
    <text x="155" y="403" font-size="26" font-weight="700" fill="#0d9488">H₂O +</text>
    <text x="155" y="433" font-size="26" font-weight="700" fill="#0d9488">Plants</text>
    <text x="155" y="463" font-size="14" font-weight="500" fill="#5b7f7a">Water changes</text>
  </g>

  <!-- Center hub -->
  <circle cx="400" cy="400" r="92" fill="#0f766e"/>
  <circle cx="400" cy="400" r="92" fill="none" stroke="#134e4a" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="400" y="380" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="0.5">THE NITROGEN</text>
    <text x="400" y="408" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="0.5">CYCLE</text>
    <text x="400" y="438" font-size="13" font-weight="500" fill="#99f6e4">4 stages · repeat</text>
  </g>

  <!-- Stage badges between nodes -->
  <g>
    <circle cx="400" cy="270" r="19" fill="#14b8a6"/>
    <circle cx="400" cy="270" r="19" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="400" y="276" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  </g>
  <g>
    <circle cx="530" cy="400" r="19" fill="#14b8a6"/>
    <circle cx="530" cy="400" r="19" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="530" y="406" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  </g>
  <g>
    <circle cx="400" cy="530" r="19" fill="#14b8a6"/>
    <circle cx="400" cy="530" r="19" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="400" y="536" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  </g>
  <g>
    <circle cx="270" cy="400" r="19" fill="#14b8a6"/>
    <circle cx="270" cy="400" r="19" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="270" y="406" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  </g>
</svg>
